<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand">
        Expense Tracker
    </a>

    <div class="d-flex align-items-center gap-3">

        <span class="text-white" id="welcomeUser"></span>

        <button
            class="btn btn-danger"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container mt-5">

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card bg-primary text-white shadow p-4">

                <h5>Total Expenses</h5>

                <h2 id="totalExpenses">₹0</h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card bg-success text-white shadow p-4">

                <h5>Total Categories</h5>

                <h2 id="totalCategories">0</h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card bg-warning shadow p-4">

                <h5>This Month</h5>

                <h2 id="monthlyExpenses">₹0</h2>

            </div>

        </div>

    </div>


    <div class="card shadow p-4 mb-5">

        <h3 class="mb-4">Add Expense</h3>

        <div class="row">

            <div class="col-md-3 mb-3">

                <input
                    type="number"
                    id="amount"
                    class="form-control"
                    placeholder="Amount"
                >

            </div>


            <div class="col-md-3 mb-3">

                <input
                    type="text"
                    id="category"
                    class="form-control"
                    placeholder="Category"
                >

            </div>


            <div class="col-md-4 mb-3">

                <input
                    type="text"
                    id="note"
                    class="form-control"
                    placeholder="Note"
                >

            </div>


            <div class="col-md-2 mb-3">

                <button
                    class="btn btn-primary w-100"
                    onclick="addExpense()"
                >
                    Add
                </button>

            </div>

        </div>

    </div>


    <div class="card shadow p-4">

        <h3 class="mb-4">Expense List</h3>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>

                    
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Note</th>
                    <th>Date</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="expenseTableBody"></tbody>

        </table>

    </div>

</div>


<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {

    window.location.href = "login.html";

}


document.getElementById("welcomeUser").innerHTML =
    `Welcome, ${user.username}`;



async function loadExpenses() {

    const response = await fetch("/expenses");

    const expenses = await response.json();


    const userExpenses = expenses.filter(expense =>
        expense.user_id == user.id
    );


    const tableBody = document.getElementById("expenseTableBody");

    tableBody.innerHTML = "";


    let total = 0;

    let monthlyTotal = 0;

    const categories = [];


    const currentMonth = new Date().getMonth();


    userExpenses.forEach(expense => {

        total += Number(expense.amount);

        const expenseDate = new Date(expense.created_at);

        const expenseMonth = expenseDate.getMonth();


        if (expenseMonth === currentMonth) {

            monthlyTotal += Number(expense.amount);

        }


        if (!categories.includes(expense.category)) {

            categories.push(expense.category);

        }


        tableBody.innerHTML += `

            <tr>

                

                <td>₹${expense.amount}</td>

                <td>${expense.category}</td>

                <td>${expense.note}</td>

                <td>${expenseDate.toLocaleDateString()}</td>

                <td>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="deleteExpense(${expense.id})"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });


    document.getElementById("totalExpenses").innerHTML =
        `₹${total}`;

    document.getElementById("monthlyExpenses").innerHTML =
        `₹${monthlyTotal}`;

    document.getElementById("totalCategories").innerHTML =
        categories.length;

}



async function addExpense() {

    const amount = document.getElementById("amount").value;

    const category = document.getElementById("category").value;

    const note = document.getElementById("note").value;


    await fetch("/expenses", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            amount,
            category,
            note,
            user_id: user.id

        })

    });


    alert("Expense Added Successfully");

    loadExpenses();


    document.getElementById("amount").value = "";

    document.getElementById("category").value = "";

    document.getElementById("note").value = "";

}



async function deleteExpense(id) {

    await fetch(`/expenses/${id}`, {

        method: "DELETE"

    });


    alert("Expense Deleted");

    loadExpenses();

}



function logoutUser() {

    localStorage.removeItem("user");

    window.location.href = "login.html";

}


loadExpenses();

</script>

</body>

</html>
